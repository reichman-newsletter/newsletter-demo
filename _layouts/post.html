---
layout: default
---
<main class="post-content">
    <div class="eyebrow">{{ page.categories | join: ", " | replace: "-", " " | capitalize }}</div>
    <h1 class="headline-xl">{{ page.title }}</h1>
    <div class="byline">By {{ page.author }} | {{ page.date | date: "%B %-d, %Y" }}</div>
    
    {% if page.featured_image %}
    <img src="{{ site.baseurl }}/assets/images/{{ page.featured_image }}" style="width: 100%; height: auto; margin: 20px 0; border: 1px solid var(--wsj-hairline);">
    {% endif %}
    
    <div class="story-summary">
        {{ content }}
    </div>
</main>
